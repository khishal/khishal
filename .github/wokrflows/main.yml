name: generate arcade contribution graphs

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Mengatur game menjadi breakout (bisa digabung dengan game lain, misal: 'pacman,breakout')
          games: 'breakout'
          # Ubah ke 'true' jika ingin menyembunyikan label nama bulan di atas grafik
          hide_month_labels: 'false'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
